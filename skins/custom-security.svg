<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="RKN-702 Cybersecurity Profile Skin">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010103"/>
      <stop offset="30%" stop-color="#0b0b1a"/>
      <stop offset="70%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#010103"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>

    <linearGradient id="neonBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#00ffff"/>
      <stop offset="40%" stop-color="#ff00de"/>
      <stop offset="60%" stop-color="#00ffff"/>
      <stop offset="80%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="40%" stop-color="rgba(0,255,255,0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="circuitGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,255,255,0.08)" stroke-width="1"/>
    </pattern>

    <pattern id="dotMatrix" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="#00ffff" opacity="0.3"/>
    </pattern>

    <clipPath id="shieldShape">
      <path d="M 60 -10 C 25 -10 0 10 0 45 L 0 155 C 0 210 55 250 75 270 L 75 270 C 95 250 150 210 150 155 L 150 45 C 150 10 95 -10 60 -10 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Circuit Grid -->
  <rect width="1200" height="420" fill="url(#circuitGrid)"/>

  <!-- Dot Matrix Overlay -->
  <rect width="1200" height="420" fill="url(#dotMatrix)" opacity="0.4"/>

  <!-- Frame -->
  <rect x="30" y="30" width="1140" height="360" fill="none" stroke="url(#neonBand)" stroke-width="3" opacity="0.7" rx="20"/>
  <rect x="30" y="30" width="1140" height="360" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1" rx="20"/>

  <!-- Corner Brackets -->
  <g stroke="#00ffff" stroke-width="3" opacity="0.95">
    <line x1="60" y1="60" x2="170" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="170"/>
    <line x1="1140" y1="60" x2="1030" y2="60"/>
    <line x1="1140" y1="60" x2="1140" y2="170"/>
    <line x1="60" y1="360" x2="170" y2="360"/>
    <line x1="60" y1="360" x2="60" y2="250"/>
    <line x1="1140" y1="360" x2="1030" y2="360"/>
    <line x1="1140" y1="360" x2="1140" y2="250"/>
  </g>

  <!-- Central Shield -->
  <g transform="translate(540, 80)" filter="url(#glow)" clip-path="url(#shieldShape)">
    <!-- Shield Outer -->
    <path d="M 60 -10 C 25 -10 0 10 0 48 L 0 155 C 0 210 55 250 75 270 L 75 270 C 95 250 150 210 150 155 L 150 48 C 150 10 95 -10 60 -10 Z"
          fill="url(#shieldGrad)" stroke="#00ffff" stroke-width="3" opacity="0.95"/>

    <!-- Shield Inner Detail -->
    <path d="M 60 2 C 30 2 8 22 8 48 L 8 120 C 8 155 35 190 55 205 L 55 205 C 75 190 102 155 102 120 L 102 48 C 102 22 80 2 60 2 Z"
          fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

    <!-- Digital Lock -->
    <g transform="translate(42, 100)">
      <!-- Lock Body -->
      <rect x="18" y="30" width="24" height="22" fill="#00ffff" rx="5" opacity="0.95"/>
      <!-- Shackle -->
      <path d="M 30 30 C 30 20 38 10 48 10 C 58 10 58 20 58 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <!-- Keyhole -->
      <circle cx="42" cy="41" r="4" fill="#010103"/>
    </g>

    <!-- Core Glow -->
    <circle cx="60" cy="95" r="32" fill="url(#coreGlow)" opacity="0.35"/>
  </g>

  <!-- Header -->
  <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="8">RKN-702</text>
  <text x="600" y="95" text-anchor="middle" fill="#00ffff" font-family="'Courier New', monospace" font-size="17" font-weight="bold" letter-spacing="4">CYBERSECURITY RESEARCHER &amp; PENETRATION TESTER</text>
  <text x="600" y="120" text-anchor="middle" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="13" letter-spacing="2">WEB SECURITY &bull; BUG BOUNTY HUNTER &bull; DAMMAM, SAUDI ARABIA</text>

  <!-- Status Bar -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="340" height="50" fill="#0d0d1a" stroke="#00ffff" stroke-width="1.5" rx="10" opacity="0.7"/>
    <circle cx="20" cy="25" r="7" fill="#00ff00" filter="url(#glow)"/>
    <text x="38" y="31" fill="#00ff00" font-family="'Courier New', monospace" font-size="14" font-weight="bold">SYSTEM SECURE</text>
    <text x="200" y="31" fill="#ffff00" font-family="'Courier New', monospace" font-size="14" font-weight="bold">LIVE MONITORING</text>
  </g>

  <!-- Bug Bounty Platforms -->
  <text x="80" y="220" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold" letter-spacing="3">BUG BOUNTY PLATFORMS</text>

  <g transform="translate(80, 235)">
    <!-- Card 1: Bugbounty.sa -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="240" height="70" fill="#0d0d1a" stroke="#00ffff" stroke-width="1.5" rx="10" opacity="0.85"/>
      <text x="18" y="25" fill="#00ffff" font-family="'Courier New', monospace" font-size="14" font-weight="bold">bugbounty.sa</text>
      <text x="18" y="50" fill="#cccccc" font-family="'Courier New', monospace" font-size="12">/profile/rkn_702</text>
    </g>

    <!-- Card 2: HackenProof -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="240" height="70" fill="#0d0d1a" stroke="#00d9ff" stroke-width="1.5" rx="10" opacity="0.85"/>
      <text x="18" y="25" fill="#00d9ff" font-family="'Courier New', monospace" font-size="14" font-weight="bold">HackenProof</text>
      <text x="18" y="50" fill="#cccccc" font-family="'Courier New', monospace" font-size="12">/hackers/rkn702</text>
    </g>

    <!-- Card 3: Intigriti -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="240" height="70" fill="#0d0d1a" stroke="#ff6b00" stroke-width="1.5" rx="10" opacity="0.85"/>
      <text x="18" y="25" fill="#ff6b00" font-family="'Courier New', monospace" font-size="14" font-weight="bold">Intigriti</text>
      <text x="18" y="50" fill="#cccccc" font-family="'Courier New', monospace" font-size="12">/researcher/rkn_702</text>
    </g>

    <!-- Card 4: Bugcrowd -->
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="240" height="70" fill="#0d0d1a" stroke="#ef476f" stroke-width="1.5" rx="10" opacity="0.85"/>
      <text x="18" y="25" fill="#ef476f" font-family="'Courier New', monospace" font-size="14" font-weight="bold">Bugcrowd</text>
      <text x="18" y="50" fill="#cccccc" font-family="'Courier New', monospace" font-size="12">/h/rkn_702</text>
    </g>
  </g>

  <!-- Skills Section -->
  <g transform="translate(80, 350)">
    <text x="0" y="0" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" letter-spacing="2">WEB SECURITY SKILLS</text>
    <text x="0" y="22" fill="#88ccff" font-family="'Courier New', monospace" font-size="12" font-weight="bold">
      OWASP Top 10 &bull; XSS &bull; SQL Injection &bull; IDOR &bull; SSRF &bull; CSRF &bull; Race Conditions &bull; API Security &bull; Burp Suite &bull; Recon
    </text>
  </g>

  <!-- Decorative Binary Code -->
  <g fill="#00ffff" opacity="0.12" font-family="'Courier New', monospace" font-size="11">
    <text x="900" y="300">01001000</text>
    <text x="900" y="315">01101001</text>
    <text x="900" y="330">01100101</text>
    <text x="900" y="345">01110011</text>
    <text x="900" y="360">01010011</text>
    <text x="900" y="375">01100101</text>
    <text x="900" y="390">01100011</text>
    <text x="900" y="405">01110101</text>
  </g>

  <!-- Connection Dots -->
  <g fill="#00ffff" opacity="0.4">
    <circle cx="100" cy="300" r="3"/>
    <circle cx="140" cy="290" r="2"/>
    <circle cx="180" cy="305" r="3"/>
    <circle cx="1100" cy="300" r="3"/>
    <circle cx="1060" cy="290" r="2"/>
    <circle cx="1020" cy="305" r="3"/>
    <line x1="100" y1="300" x2="140" y2="290" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
    <line x1="140" y1="290" x2="180" y2="305" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
    <line x1="1100" y1="300" x2="1060" y2="290" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
    <line x1="1060" y1="290" x2="1020" y2="305" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Footer -->
  <text x="600" y="412" text-anchor="middle" fill="#444" font-family="'Courier New', monospace" font-size="11" letter-spacing="1">ETHICAL HACKING &bull; RESPONSIBLE DISCLOSURE &bull; SECURE THE WEB</text>
</svg>
