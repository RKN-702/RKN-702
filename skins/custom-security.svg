<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="RKN-702 Cybersecurity Profile">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>

    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff00de"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>

    <pattern id="grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.5"/>

  <!-- Frame -->
  <rect x="25" y="25" width="1150" height="370" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4" rx="15"/>
  <rect x="25" y="25" width="1150" height="370" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1" rx="15"/>

  <!-- Corner brackets -->
  <g stroke="#00ffff" stroke-width="2.5" opacity="0.8">
    <line x1="55" y1="55" x2="130" y2="55"/>
    <line x1="55" y1="55" x2="55" y2="130"/>
    <line x1="1145" y1="55" x2="1070" y2="55"/>
    <line x1="1145" y1="55" x2="1145" y2="130"/>
    <line x1="55" y1="365" x2="130" y2="365"/>
    <line x1="55" y1="365" x2="55" y2="290"/>
    <line x1="1145" y1="365" x2="1070" y2="365"/>
    <line x1="1145" y1="365" x2="1145" y2="290"/>
  </g>

  <!-- Central Shield -->
  <g transform="translate(540, 100)">
    <!-- Outer shield -->
    <path d="M 60 0 C 25 0 0 20 0 50 L 0 140 C 0 190 55 230 75 250 L 75 250 C 95 230 150 190 150 140 L 150 50 C 150 20 95 0 60 0 Z"
          fill="url(#shield)" stroke="#00ffff" stroke-width="2.5" opacity="0.95"/>

    <!-- Inner shield -->
    <path d="M 60 5 C 30 5 8 25 8 50 L 8 115 C 8 145 35 180 55 195 L 55 195 C 75 180 102 145 102 115 L 102 50 C 102 25 80 5 60 5 Z"
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Lock -->
    <g transform="translate(42, 110)">
      <rect x="18" y="30" width="24" height="22" fill="#00ffff" rx="5" opacity="0.9"/>
      <path d="M 30 30 C 30 20 38 10 48 10 C 58 10 58 20 58 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="42" cy="41" r="3.5" fill="#05050a"/>
    </g>

    <!-- Glow -->
    <circle cx="60" cy="95" r="30" fill="#00ffff" opacity="0.15"/>
  </g>

  <!-- Header Text -->
  <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="bold" letter-spacing="6">RKN-702</text>
  <text x="600" y="90" text-anchor="middle" fill="#00ffff" font-family="Courier New, monospace" font-size="16" font-weight="bold" letter-spacing="3">CYBERSECURITY RESEARCHER &amp; PENETRATION TESTER</text>
  <text x="600" y="113" text-anchor="middle" fill="#888888" font-family="Courier New, monospace" font-size="12" letter-spacing="1">WEB SECURITY &bull; BUG BOUNTY HUNTER &bull; DAMMAM, SAUDI ARABIA</text>

  <!-- Status Bar -->
  <g transform="translate(70, 155)">
    <rect x="0" y="0" width="320" height="48" fill="#0d0d1a" stroke="#00ffff" stroke-width="1" rx="8" opacity="0.8"/>
    <circle cx="18" cy="24" r="6" fill="#00ff00" opacity="0.9"/>
    <text x="32" y="30" fill="#00ff00" font-family="Courier New, monospace" font-size="13" font-weight="bold">SYSTEM SECURE</text>
    <text x="190" y="30" fill="#ffff00" font-family="Courier New, monospace" font-size="13" font-weight="bold">● ACTIVE</text>
  </g>

  <!-- Bug Bounty Platforms -->
  <text x="70" y="215" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold" letter-spacing="2">BUG BOUNTY PLATFORMS</text>

  <g transform="translate(70, 230)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="65" fill="#0d0d1a" stroke="#00ffff" stroke-width="1" rx="8" opacity="0.85"/>
      <text x="16" y="24" fill="#00ffff" font-family="Courier New, monospace" font-size="13" font-weight="bold">bugbounty.sa</text>
      <text x="16" y="46" fill="#cccccc" font-family="Courier New, monospace" font-size="11">/profile/rkn_702</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="250" height="65" fill="#0d0d1a" stroke="#00d9ff" stroke-width="1" rx="8" opacity="0.85"/>
      <text x="16" y="24" fill="#00d9ff" font-family="Courier New, monospace" font-size="13" font-weight="bold">HackenProof</text>
      <text x="16" y="46" fill="#cccccc" font-family="Courier New, monospace" font-size="11">/hackers/rkn702</text>
    </g>
    <!-- Card 3 -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="250" height="65" fill="#0d0d1a" stroke="#ff00de" stroke-width="1" rx="8" opacity="0.85"/>
      <text x="16" y="24" fill="#ff00de" font-family="Courier New, monospace" font-size="13" font-weight="bold">Intigriti</text>
      <text x="16" y="46" fill="#cccccc" font-family="Courier New, monospace" font-size="11">/researcher/rkn_702</text>
    </g>
    <!-- Card 4 -->
    <g transform="translate(810, 0)">
      <rect x="0" y="0" width="250" height="65" fill="#0d0d1a" stroke="#ffff00" stroke-width="1" rx="8" opacity="0.85"/>
      <text x="16" y="24" fill="#ffff00" font-family="Courier New, monospace" font-size="13" font-weight="bold">Bugcrowd</text>
      <text x="16" y="46" fill="#cccccc" font-family="Courier New, monospace" font-size="11">/h/rkn_702</text>
    </g>
  </g>

  <!-- Skills Section -->
  <g transform="translate(70, 345)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="bold" letter-spacing="1">WEB SECURITY SKILLS</text>
    <text x="0" y="20" fill="#88ccff" font-family="Courier New, monospace" font-size="11.5" font-weight="bold">
      OWASP Top 10 &bull; XSS &bull; SQLi &bull; IDOR &bull; SSRF &bull; CSRF &bull; API Security &bull; Burp Suite &bull; Recon
    </text>
  </g>

  <!-- Footer -->
  <text x="600" y="408" text-anchor="middle" fill="#555555" font-family="Courier New, monospace" font-size="11" letter-spacing="1">ETHICAL HACKING &bull; RESPONSIBLE DISCLOSURE &bull; SECURE THE WEB</text>
</svg>
