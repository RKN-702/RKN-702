<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="RKN-702 Cybersecurity Profile">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d44"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 255, 255, 0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="260" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.3" rx="10"/>

  <!-- Central Shield Icon -->
  <g transform="translate(540, 40)">
    <!-- Shield outer -->
    <path d="M 60 0 C 20 0 0 20 0 60 L 0 140 C 0 180 40 220 60 240 L 60 240 C 80 220 120 180 120 140 L 120 60 C 120 20 100 0 60 0 Z" fill="url(#shieldGradient)" stroke="#00ffff" stroke-width="3"/>
    
    <!-- Shield inner -->
    <path d="M 60 20 C 35 20 15 35 15 60 L 15 110 C 15 135 30 165 50 180 L 50 180 C 70 165 85 135 85 110 L 85 60 C 85 35 70 20 60 20 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    
    <!-- Lock icon inside shield -->
    <g transform="translate(45, 75)">
      <!-- Lock body -->
      <rect x="15" y="20" width="20" height="25" fill="#00ffff" rx="3"/>
      <!-- Lock shackle -->
      <path d="M 25 20 C 25 10 35 0 45 0 C 55 0 55 10 55 20" fill="none" stroke="#00ffff" stroke-width="3" stroke-linecap="round"/>
      <!-- Keyhole -->
      <circle cx="35" cy="35" r="3" fill="#1a1a2e"/>
    </g>
  </g>

  <!-- Circuit lines -->
  <g stroke="#00ffff" stroke-width="1" opacity="0.4">
    <line x1="50" y1="150" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="200" y2="220"/>
    <line x1="200" y1="220" x2="350" y2="220"/>
    <line x1="350" y1="220" x2="350" y2="150"/>
    <line x1="350" y1="150" x2="500" y2="150"/>
    
    <line x1="1000" y1="150" x2="850" y2="150"/>
    <line x1="850" y1="150" x2="850" y2="220"/>
    <line x1="850" y1="220" x2="700" y2="220"/>
    <line x1="700" y1="220" x2="700" y2="150"/>
    <line x1="700" y1="150" x2="550" y2="150"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00ffff" stroke-width="2" opacity="0.6">
    <!-- Top left -->
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <!-- Top right -->
    <line x1="1160" y1="40" x2="1120" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="80"/>
    <!-- Bottom left -->
    <line x1="40" y1="260" x2="80" y2="260"/>
    <line x1="40" y1="260" x2="40" y2="220"/>
    <!-- Bottom right -->
    <line x1="1160" y1="260" x2="1120" y2="260"/>
    <line x1="1160" y1="260" x2="1160" y2="220"/>
  </g>

  <!-- Status indicators -->
  <g transform="translate(50, 240)">
    <circle cx="10" cy="10" r="6" fill="#00ff00" opacity="0.8"/>
    <text x="25" y="15" fill="#00ffff" font-family="monospace" font-size="12">SYSTEM SECURE</text>
    <circle cx="140" cy="10" r="6" fill="#ff4500" opacity="0.8"/>
    <text x="155" y="15" fill="#ff4500" font-family="monospace" font-size="12">THREAT DETECTED</text>
  </g>

  <!-- Binary code accents -->
  <g fill="#00ffff" opacity="0.3" font-family="monospace" font-size="10">
    <text x="900" y="80">01001000</text>
    <text x="900" y="100">01101001</text>
    <text x="900" y="120">01100101</text>
    <text x="900" y="140">01110011</text>
    <text x="250" y="180">01010011</text>
    <text x="250" y="200">01100101</text>
    <text x="250" y="220">01100011</text>
    <text x="250" y="240">01110101</text>
  </g>
</svg>
