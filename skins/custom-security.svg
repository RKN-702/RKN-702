<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="RKN-702 Cybersecurity Profile - Interactive Skin">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="50%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>

    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .spin { animation: spin 10s linear infinite; }
    .fade { animation: fade 3s ease-in-out infinite alternate; }
    .glow-text { animation: glowText 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }
    @keyframes glowText { 0%, 100% { filter: drop-shadow(0 0 5px #00ffff); } 50% { filter: drop-shadow(0 0 20px #00ffff) drop-shadow(0 0 40px #ff00ff); } }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
    .scanline { animation: scanline 4s linear infinite; opacity: 0.3; }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- Animated grid -->
  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0, 255, 255, 0.08)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="60 60" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanline effect -->
  <rect class="scanline" width="1200" height="2" fill="#00ffff" opacity="0.4"/>

  <!-- Border frame with glow -->
  <rect x="30" y="30" width="1140" height="340" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6" rx="15" class="pulse"/>

  <!-- Corner animated brackets -->
  <g stroke="#00ffff" stroke-width="3" opacity="0.8" class="fade">
    <line x1="50" y1="50" x2="120" y2="50"/>
    <line x1="50" y1="50" x2="50" y2="120"/>
    <line x1="1150" y1="50" x2="1080" y2="50"/>
    <line x1="1150" y1="50" x2="1150" y2="120"/>
    <line x1="50" y1="350" x2="120" y2="350"/>
    <line x1="50" y1="350" x2="50" y2="280"/>
    <line x1="1150" y1="350" x2="1080" y2="350"/>
    <line x1="1150" y1="350" x2="1150" y2="280"/>
  </g>

  <!-- Central Animated Shield -->
  <g transform="translate(540, 60)" class="pulse" filter="url(#glow)">
    <!-- Shield glow -->
    <path d="M 60 -20 C 20 -20 0 0 0 40 L 0 140 C 0 190 50 230 70 250 L 70 250 C 90 230 140 190 140 140 L 140 40 C 140 0 100 -20 60 -20 Z" fill="#1a1a2e" stroke="url(#accentGradient)" stroke-width="4" opacity="0.9"/>
    
    <!-- Inner shield -->
    <path d="M 60 0 C 35 0 15 15 15 40 L 15 110 C 15 150 40 185 60 205 L 60 205 C 80 185 105 150 105 110 L 105 40 C 105 15 85 0 60 0 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7" class="glow-text"/>
    
    <!-- Digital lock with animation -->
    <g transform="translate(45, 90)">
      <rect x="15" y="25" width="20" height="20" fill="#00ffff" rx="4" class="pulse"/>
      <path d="M 25 25 C 25 15 35 5 45 5 C 55 5 55 15 55 25" fill="none" stroke="#ff00ff" stroke-width="3" stroke-linecap="round" class="spin"/>
      <circle cx="35" cy="35" r="3" fill="#1a1a2e"/>
    </g>
  </g>

  <!-- Header Text -->
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="bold" letter-spacing="4" class="glow-text">RKN-702</text>
  <text x="600" y="85" text-anchor="middle" fill="#00ffff" font-family="monospace" font-size="16" letter-spacing="2" class="fade">CYBERSECURITY RESEARCHER &amp; PENETRATION TESTER</text>

  <!-- Status Row -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="8" fill="#00ff00" class="pulse" filter="url(#glow)"/>
    <text x="40" y="25" fill="#00ff00" font-family="monospace" font-size="14">SYSTEM SECURE</text>
    <text x="220" y="25" fill="#ff4500" font-family="monospace" font-size="14" class="blink">● THREAT MONITORING ACTIVE</text>
  </g>

  <!-- Bug Bounty Platforms -->
  <g transform="translate(60, 180)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">🎯 BUG BOUNTY PLATFORMS</text>
    
    <!-- Platform cards -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="280" height="60" fill="#1a1a2e" stroke="#00ffff" stroke-width="1" rx="8" opacity="0.8" class="fade"/>
      <text x="20" y="25" fill="#00ffff" font-family="monospace" font-size="13">bugbounty.sa</text>
      <text x="20" y="45" fill="#ffffff" font-family="monospace" font-size="12">/profile/rkn_702</text>
    </g>
    <g transform="translate(300, 30)">
      <rect x="0" y="0" width="280" height="60" fill="#1a1a2e" stroke="#00d9ff" stroke-width="1" rx="8" opacity="0.8" class="fade"/>
      <text x="20" y="25" fill="#00d9ff" font-family="monospace" font-size="13">HackenProof</text>
      <text x="20" y="45" fill="#ffffff" font-family="monospace" font-size="12">/hackers/rkn702</text>
    </g>
    <g transform="translate(600, 30)">
      <rect x="0" y="0" width="280" height="60" fill="#1a1a2e" stroke="#ff6b00" stroke-width="1" rx="8" opacity="0.8" class="fade"/>
      <text x="20" y="25" fill="#ff6b00" font-family="monospace" font-size="13">Intigriti</text>
      <text x="20" y="45" fill="#ffffff" font-family="monospace" font-size="12">/researcher/rkn_702</text>
    </g>
    <g transform="translate(900, 30)">
      <rect x="0" y="0" width="280" height="60" fill="#1a1a2e" stroke="#ef476f" stroke-width="1" rx="8" opacity="0.8" class="fade"/>
      <text x="20" y="25" fill="#ef476f" font-family="monospace" font-size="13">Bugcrowd</text>
      <text x="20" y="45" fill="#ffffff" font-family="monospace" font-size="12">/h/rkn_702</text>
    </g>
  </g>

  <!-- Skills Row -->
  <g transform="translate(60, 320)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">⚡ WEB SECURITY SKILLS</text>
    <text x="0" y="25" fill="#00ffff" font-family="monospace" font-size="13">OWASP Top 10 · XSS · SQLi · IDOR · SSRF · API Security · Burp Suite · Recon</text>
  </g>

  <!-- Animated binary code -->
  <g fill="#00ffff" opacity="0.2" font-family="monospace" font-size="12">
    <text x="900" y="280">01001000</text>
    <text x="900" y="300">01101001</text>
    <text x="900" y="320">01100101</text>
    <text x="900" y="340">01110011</text>
    <text x="900" y="360">01010011</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 20" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
